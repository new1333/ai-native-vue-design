# 文档站部署（GitHub Pages）—— main 每次推送即构建发布
#
# 职责：安装依赖 → `pnpm docs:build`（VitePress 产出 apps/docs/.vitepress/dist）→
# 上传 Pages artifact → 部署到 GitHub Pages（https://new1333.github.io/ai-native-vue-design/）。
# 不做测试门禁：组件质量门禁在 E2E 工作流与本机 vitest/typecheck；本工作流只负责发布。
#
# 协作约定（勿单侧改动）：
# - apps/docs/.vitepress/config.ts 的 `base: '/ai-native-vue-design/'` 必须与仓库名一致，
#   否则 Pages 子路径下静态资源 404；
# - 首次部署前需在仓库 Settings → Pages 将 Source 设为「GitHub Actions」
#   （下方 configure-pages 的 enablement 也会代为开启）。

name: Docs Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {} # 支持手动触发（例如仅改文档后强制重发布）

permissions:
  contents: read
  pages: write # deploy-pages 需要
  id-token: write # Pages 部署用 OIDC 而非长效 PAT

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true # 旧部署未完成时让位给最新推送

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本与 E2E 工作流保持一致（本仓 engines >=10，lockfile v9 用 major 11）。
      # 顺序要求：pnpm 必须先于 setup-node 安装，`cache: pnpm` 才能定位 store。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # engines: >=20.19；与维护者本机一致取 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # workspace 包（@ui/components / @ui/tokens）exports 直指 src，
        # vitepress 由源码构建——无需先跑各包 build。

      - name: Build docs
        run: pnpm docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # 仓库未开启 Pages 时代为开启（Source = GitHub Actions）

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
